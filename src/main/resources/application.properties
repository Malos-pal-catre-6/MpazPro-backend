spring.application.name=mpazpro-backend
server.port=8080

# Perfil local por defecto (ver application-local.properties)
spring.profiles.active=local

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT (cambia esta clave antes de entregar el proyecto)
app.jwt.secret=CAMBIA_ESTA_CLAVE_POR_UNA_LARGA_Y_SECRETA_1234567890
app.jwt.expiracion-horas=12
